<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e1013">
  <title>BetterAI — {% block title %}dashboard{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">BA</span> BetterAI</div>
    <nav class="tabs">
      <a href="{{ url_for('biglietto_ai') }}" class="ai {{ 'on' if active=='ai' }}">Biglietto AI</a>
      <a href="{{ url_for('oggi') }}"       class="{{ 'on' if active=='oggi' }}">Palinsesto</a>
      <a href="{{ url_for('schedine') }}"   class="{{ 'on' if active=='schedine' }}">Schedine</a>
      <a href="{{ url_for('algoritmo') }}"  class="{{ 'on' if active=='algoritmo' }}">Algoritmo</a>
      <a href="{{ url_for('modello') }}"    class="{{ 'on' if active=='modello' }}">Modello</a>
      <a href="{{ url_for('database') }}"   class="{{ 'on' if active=='db' }}">Database</a>
    </nav>
    <form action="{{ url_for('aggiorna_quote') }}" method="post" class="refresh">
      <button type="submit" title="Legge curl.txt dalla cartella di avvio e riscarica le quote da Sisal">
        <span class="ico" aria-hidden="true">&#x21bb;</span><span class="txt">Aggiorna quote</span>
      </button>
    </form>
  </header>
  <main>
    {% block main %}{% endblock %}
  </main>
  <footer class="foot">
    Quote reali da <b>Sisal</b> (i cookie durano 30&ndash;60 min) · dove mancano, stima del modello con aggio 0.93
  </footer>
  <script src="{{ url_for('static', filename='betslip.js') }}"></script>
</body>
</html>
